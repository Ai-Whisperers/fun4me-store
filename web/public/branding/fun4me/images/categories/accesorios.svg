<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <radialGradient id="accGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#accGrad)"/>
  <ellipse cx="300" cy="200" rx="200" ry="150" fill="url(#accGlow)"/>
  <!-- Grid/squares icon -->
  <g transform="translate(255, 130)" opacity="0.5">
    <rect x="0" y="0" width="35" height="35" rx="5" fill="#9C27B0"/>
    <rect x="45" y="0" width="35" height="35" rx="5" fill="#9C27B0"/>
    <rect x="0" y="45" width="35" height="35" rx="5" fill="#9C27B0"/>
    <rect x="45" y="45" width="35" height="35" rx="5" fill="#9C27B0"/>
  </g>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" opacity="0.9">Accesorios</text>
  <text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9C27B0" opacity="0.8">Complementos y extras</text>
</svg>
