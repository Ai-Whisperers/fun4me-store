  </g>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" opacity="0.9">Lenceria</text>
  <text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#E91E63" opacity="0.8">Piezas sensuales y provocativas</text>
