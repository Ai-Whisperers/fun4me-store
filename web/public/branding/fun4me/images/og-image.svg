<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#0f0f1a" />
    </linearGradient>
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9C27B0" />
      <stop offset="100%" style="stop-color:#E91E63" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogGradient)"/>
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#ogGlow)"/>
  <!-- Logo text -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="96" font-weight="bold" fill="url(#textGradient)">Fun4Me</text>
  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.8">Tu tienda de confianza</text>
  <!-- Location -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#E91E63" opacity="0.9">Asuncion, Paraguay</text>
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="50" fill="none" stroke="#9C27B0" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="530" r="70" fill="none" stroke="#E91E63" stroke-width="1" opacity="0.3"/>
</svg>
