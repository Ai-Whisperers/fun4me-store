version: "3.8"

services:
  fun4me-store-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: fun4me-store-dev
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm dev"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
